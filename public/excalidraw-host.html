<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PolyCode Whiteboard</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
        font-family: system-ui, sans-serif;
      }
      .wb-status {
        display: grid;
        place-items: center;
        height: 100%;
        color: #64748b;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      .wb-status.error {
        color: #b91c1c;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="wb-status">Loading Excalidraw whiteboard…</div>
    </div>
    <script type="module">
      const rootEl = document.getElementById("root");
      const MSG = "polycode-excalidraw";

      function showError(message) {
        rootEl.innerHTML = `<div class="wb-status error">${message}</div>`;
      }

      function post(type, payload = {}) {
        parent.postMessage({ source: MSG, type, ...payload }, "*");
      }

      function slimAppState(appState) {
        if (!appState) return undefined;
        return {
          viewBackgroundColor: appState.viewBackgroundColor,
          currentItemStrokeColor: appState.currentItemStrokeColor,
          currentItemBackgroundColor: appState.currentItemBackgroundColor,
          currentItemFillStyle: appState.currentItemFillStyle,
          currentItemStrokeWidth: appState.currentItemStrokeWidth,
          currentItemStrokeStyle: appState.currentItemStrokeStyle,
          currentItemRoughness: appState.currentItemRoughness,
          currentItemOpacity: appState.currentItemOpacity,
          currentItemFontFamily: appState.currentItemFontFamily,
          currentItemFontSize: appState.currentItemFontSize,
          currentItemTextAlign: appState.currentItemTextAlign,
          currentItemStartArrowhead: appState.currentItemStartArrowhead,
          currentItemEndArrowhead: appState.currentItemEndArrowhead,
          scrollX: appState.scrollX,
          scrollY: appState.scrollY,
          zoom: appState.zoom,
          gridSize: appState.gridSize,
          theme: appState.theme,
        };
      }

      try {
        const cssHref =
          "https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css";
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = cssHref;
        document.head.appendChild(link);

        const React = await import("react");
        const { createRoot } = await import("react-dom/client");
        const ExcalidrawMod = await import(
          "https://esm.sh/@excalidraw/excalidraw@0.18.1?external=react,react-dom"
        );
        const Excalidraw = ExcalidrawMod.Excalidraw;

        let initialScene = {
          elements: [],
          appState: { viewBackgroundColor: "#ffffff" },
          files: {},
        };
        let saveTimer = null;
        let started = false;

        function mount() {
          if (started) return;
          started = true;
          rootEl.innerHTML = "";
          const mountNode = document.createElement("div");
          mountNode.style.width = "100%";
          mountNode.style.height = "100%";
          rootEl.appendChild(mountNode);

          const app = React.createElement(Excalidraw, {
            initialData: {
              elements: initialScene.elements || [],
              appState: {
                viewBackgroundColor: "#ffffff",
                ...(initialScene.appState || {}),
                collaborators: new Map(),
              },
              files: initialScene.files || {},
              scrollToContent: Boolean(initialScene.elements?.length),
            },
            theme: "light",
            UIOptions: {
              canvasActions: {
                loadScene: true,
                export: { saveFileToDisk: true },
                saveAsImage: true,
                clearCanvas: true,
                changeViewBackgroundColor: true,
                toggleTheme: true,
              },
            },
            onChange: (elements, appState, files) => {
              window.clearTimeout(saveTimer);
              saveTimer = window.setTimeout(() => {
                post("change", {
                  elements,
                  appState: slimAppState(appState),
                  files: files || {},
                });
              }, 350);
            },
          });

          createRoot(mountNode).render(app);
          post("ready");
        }

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || data.source !== MSG) return;
          if (data.type === "init") {
            initialScene = data.scene || initialScene;
            mount();
          }
        });

        post("host-ready");
      } catch (err) {
        console.error(err);
        showError(
          "Could not load the whiteboard. Check your network connection and try again.",
        );
        post("error", { message: String(err?.message || err) });
      }
    </script>
  </body>
</html>
